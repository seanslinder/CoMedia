<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CoMedia — Создание комнаты</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<link rel="stylesheet" href="styles/theme.css" />
		<link rel="stylesheet" href="styles/common.css" />
		<link rel="stylesheet" href="styles/createRoom.css" />
		<script src="theme.js"></script>
	</head>
	<body>
		<div class="container">
			<header>
				<button class="back-btn" onclick="window.history.back()">
					<i class="fas fa-arrow-left"></i>
				</button>

				<div class="logo-container">
					<div class="logo-icon">
						<div class="logo-segment segment-1"></div>
						<div class="logo-segment segment-2"></div>
						<div class="logo-segment segment-3"></div>
						<div class="logo-segment segment-4"></div>
					</div>
					<div class="logo-text">
						<span class="logo-co">Co</span>
						<span class="logo-media">Media</span>
					</div>
				</div>
				
				<button onclick="toggleTheme()" class="theme-toggle" title="Toggle theme">
					<svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
					<svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
				</button>
			</header>

			<div id="inline-message" class="inline-message" role="status" aria-live="polite"></div>

			<div class="room-type-switcher">
				<button class="room-type-btn public active" data-type="public">
					<i class="fas fa-globe-americas"></i>
					<span>Публичная</span>
				</button>
				<button class="room-type-btn private" data-type="private">
					<i class="fas fa-lock"></i>
					<span>Приватная</span>
				</button>
			</div>

			<div class="form-section">
				<h2 class="form-title">Настройки комнаты</h2>

				<div class="form-group">
					<label class="form-label">Название комнаты</label>
					<input
						type="text"
						class="form-control"
						placeholder="Например: Вечер ужасов с друзьями"
						id="room-name"
					/>
				</div>

				<div class="form-group public-section">
					<label class="form-label">Категория</label>
					<div class="category-select">
						<div class="category-item active">Фильмы</div>
						<div class="category-item">Сериалы</div>
						<div class="category-item">Аниме</div>
						<div class="category-item">Стримы</div>
						<div class="category-item">Спорт</div>
						<div class="category-item">Музыка</div>
					</div>
				</div>

				<div class="form-group private-section" style="display: none">
					<label class="form-label">Пароль</label>
					<div class="password-options">
						<input
							type="password"
							class="form-control"
							placeholder="••••••••"
							id="room-password"
						/>
						<div
							class="password-toggle"
							onclick="togglePasswordVisibility()"
						>
							<i class="fas fa-eye" id="password-icon"></i>
						</div>
					</div>
					<div class="password-generator">
						Не придумали пароль?
						<a href="#" onclick="generatePassword()"
							>Сгенерировать надежный пароль</a
						>
					</div>
				</div>

				<div class="form-group private-section" style="display: none">
					<label class="form-label"
						>Максимальное количество участников</label
					>
					<div class="participants-limit">
						<span>Участники:</span>
						<div class="limit-control">
							<button class="limit-btn" onclick="changeLimit(-1)">
								-
							</button>
							<span class="limit-value" id="limit-value">8</span>
							<button class="limit-btn" onclick="changeLimit(1)">
								+
							</button>
						</div>
						<span>(макс. 20)</span>
					</div>
				</div>
			</div>

			<div class="form-section">
				<h2 class="form-title">Выбор контента</h2>

				<div class="form-group">
					<label class="form-label">Вставьте ссылку на контент</label>
					<input
						type="url"
						class="form-control"
						placeholder="https://youtube.com/watch?v=..."
						id="media-url"
					/>
				</div>
				<div class="form-group">
					<label class="form-label">Или загрузите файл (.mp4)</label>
					<input
						type="file"
						accept="video/mp4"
						class="form-control"
						id="media-file"
					/>
				</div>
			</div>

			<div class="btn-container">
				<button class="btn btn-secondary">
					<i class="fas fa-times"></i> Отмена
				</button>
				<button id="create-room-btn" class="btn btn-primary">
					<i class="fas fa-check"></i> Создать комнату
				</button>
			</div>
		</div>

		<script src="api.js"></script>
		<script src="createRoom.js"></script>
	</body>
</html>
