<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CoMedia — Совместный просмотр</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<link rel="stylesheet" href="styles/theme.css" />
		<link rel="stylesheet" href="styles/common.css" />
		<link rel="stylesheet" href="styles/index.css" />
		<script src="theme.js"></script>
	</head>
	<body>
		<div class="container">
			<header style="position: relative;">
				<div class="logo-container">
					<div class="logo-icon">
						<div class="logo-segment segment-1"></div>
						<div class="logo-segment segment-2"></div>
						<div class="logo-segment segment-3"></div>
						<div class="logo-segment segment-4"></div>
					</div>
					<div class="logo-text">
						<span class="logo-co">Co</span>
						<span class="logo-media">Media</span>
					</div>
				</div>
				<button onclick="toggleTheme()" class="theme-toggle" style="position: absolute; right: 20px;" title="Toggle theme">
					<svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
					<svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
				</button>
			</header>

			<div
				id="inline-message"
				class="inline-message"
				role="status"
				aria-live="polite"
			></div>

			<section class="private-room-section">
				<h2 class="section-title">Присоединиться к комнате</h2>
				<p class="section-subtitle">
					Введите ID комнаты и пароль, если требуется
				</p>

				<div class="input-group">
					<label for="room-code">ID комнаты</label>
					<input
						type="text"
						id="room-code"
						class="input-field"
						placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
					/>
				</div>

				<div class="input-group">
					<label for="room-password"
						>Пароль (для приватной комнаты)</label
					>
					<input
						type="password"
						id="room-password"
						class="input-field"
						placeholder="••••••••"
					/>
				</div>

				<button class="btn-primary" style="width: 100%">
					Войти в комнату
				</button>
			</section>

			<section>
				<h2 class="section-title">Публичные комнаты онлайн</h2>
				<p class="section-subtitle">
					Присоединяйтесь к просмотру с другими пользователями
				</p>

				<div class="rooms-grid"></div>
			</section>
		</div>

		<button class="btn-primary create-room">
			<i class="fas fa-plus"></i> Создать комнату
		</button>

		<script src="api.js"></script>
		<script src="index.js"></script>
	</body>
</html>
