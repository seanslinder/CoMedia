services:
  db:
    image: postgres:15-alpine
    container_name: comedia-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comedia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: comedia-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: